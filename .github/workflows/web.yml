name: Web

# Deploy: migraciones Supabase (si hay) → build Flutter → Firebase Hosting.
#
# Variables (Settings → Variables):
#   FIREBASE_PROJECT_ID
#   SUPABASE_PROJECT_REF
#   SUPABASE_URL                 (opcional, dart-define)
#
# Secrets (Settings → Secrets):
#   FIREBASE_SERVICE_ACCOUNT     → JSON completo de la SA
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_DB_PASSWORD
#   SUPABASE_ANON_KEY            (opcional, dart-define)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-hosting
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect migrations
        id: migrations
        run: |
          if compgen -G "supabase/migrations/*.sql" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Migraciones detectadas:"
            ls -1 supabase/migrations/*.sql
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No hay archivos en supabase/migrations — se omite db push."
          fi

      - name: Verify Firebase config
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Falta la variable FIREBASE_PROJECT_ID (Settings → Variables, no Secrets)"
            missing=1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secret FIREBASE_SERVICE_ACCOUNT (JSON de la service account)"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "Guía: docs/ci-cd.md"
            exit 1
          fi
          echo "Firebase OK (project: $FIREBASE_PROJECT_ID)"

      - name: Verify Supabase config
        if: steps.migrations.outputs.found == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Falta la variable SUPABASE_PROJECT_REF (Settings → Variables)"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Falta el secret SUPABASE_DB_PASSWORD"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "Guía: docs/ci-cd.md → Migraciones en CI"
            exit 1
          fi
          echo "Supabase OK (ref: $SUPABASE_PROJECT_REF)"

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.found == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        if: steps.migrations.outputs.found == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push
          echo "Migraciones aplicadas (o ya estaban al día)."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `.env` es asset de Flutter (flutter_dotenv) y está gitignored.
      - name: Prepare .env for Flutter
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          cat > .env << EOF
          APP_ENV=development
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          EOF
          echo ".env preparado para assets"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .
