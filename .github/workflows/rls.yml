name: RLS

# Tests pgTAP del modelo de acceso (supabase/tests/*.test.sql)
# Requiere Docker en el runner.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/rls.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/rls.yml'
  workflow_dispatch:

concurrency:
  group: rls-tests
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run RLS / pgTAP tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
