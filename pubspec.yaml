name: comunexa
description: "Plataforma multi-tenant para administradoras de propiedad horizontal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  go_router: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/branding/figma/
    - .env
    - .env.example
